name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Server unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install vitest @vitest/coverage-v8 supertest @types/supertest dotenv-cli
        working-directory: server
      - run: npx vitest run src/tests/unit
        working-directory: server
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-min-32-chars-long!!
          JWT_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          DATABASE_URL: postgresql://localhost:5432/placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder

  test-client:
    name: Client unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install vitest @vitest/coverage-v8 @testing-library/react @testing-library/jest-dom @testing-library/user-event jsdom
        working-directory: client
      - run: npx vitest run
        working-directory: client
