[build]
  base    = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION    = "20"
  VITE_API_URL    = "https://wavecast-server-production.up.railway.app"

# SPA fallback — every unknown path serves index.html so React Router handles it
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
